
project:
  type: default
  output-dir: _output

format:
  html:
    toc: true
    toc-depth: 3
    number-sections: true
    code-fold: true

  pdf:
    toc: true
    number-sections: true
    fig-width: 7
    fig-height: 4
    geometry:
      - margin=2.5cm

execute:
  echo: true
  warning: false
  message: false
